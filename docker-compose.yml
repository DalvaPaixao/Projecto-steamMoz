services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stemmoz_backend
    restart: unless-stopped
    environment:
      # Usa o container MySQL já existente (stemmoz_rh_mysql), ligado à
      # rede "stemmoz_net" abaixo em vez de subir um novo serviço mysql.
      DB_HOST: stemmoz_rh_mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-stemmoz_rh}
      FLASK_DEBUG: "false"
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      # Força um modo de cálculo compatível com o CPU do servidor (sem AVX).
      # Sem isto o reconhecimento facial falha com "Illegal instruction".
      OPENBLAS_CORETYPE: NEHALEM 
      CHAVE_QUIOSQUE: ${CHAVE_QUIOSQUE:-}
    ports:
      - "5010:5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - stemmoz_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: stemmoz_frontend
    restart: unless-stopped
    ports:
      - "8030:80"
    depends_on:
      - backend

networks:
  stemmoz_net:
    name: stemmoz_net

volumes:
  uploads_data: